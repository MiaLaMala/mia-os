name: Deploy

# Der Homelab-LXC ist aus dem Internet nicht erreichbar, GitHub-Runner koennen
# also nicht per SSH hineindeployen. Statt den Container aufzumachen, holt sich
# der Server die Aenderungen selbst ab (Pull statt Push).
#
# Dieser Workflow prueft daher nur, dass ein Deployment sauber waere:
# Image bauen, veroeffentlichen, Compose-Datei validieren. Das Ausrollen macht
# der Timer auf dem LXC (systemd, mia-os-deploy.timer).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Image veroeffentlichen
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: An GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Bauen und pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate:
    name: Compose pruefen
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config validieren
        run: |
          # Platzhalter-Env, damit die Interpolation nicht meckert
          cp .env.example .env
          docker compose config --quiet
          echo "compose-Datei ist gueltig"
