name: Deploy

# Der Homelab-LXC ist aus dem Internet nicht erreichbar, GitHub-Runner koennen
# also nicht per SSH hineindeployen. Statt den Container aufzumachen, holt sich
# der Server die Aenderungen selbst ab (Pull statt Push).
#
# Dieser Workflow prueft daher nur, dass ein Deployment sauber waere:
# Image bauen, Compose-Datei validieren. Das Ausrollen macht der Timer auf
# dem LXC (systemd, mia-os-deploy.timer).
#
# Das Abbild wird gebaut, aber NICHT veroeffentlicht: der LXC baut selbst und
# holt nichts aus einer Registry. Begruendung steht beim Bau-Schritt.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Abbild pruefen
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Abbild bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          # Bauen ja, veroeffentlichen nein.
          #
          # Der Push scheiterte seit dem Repo-Umzug bei JEDEM Lauf mit
          # "denied: permission_denied: read_package": das Paket
          # ghcr.io/mialamala/mia-os haengt noch am alten Repo, und das neue
          # darf dort nicht hineinschreiben. Jeder Fehlschlag hat Mia eine
          # Mail geschickt.
          #
          # Gebraucht wird das Abbild ohnehin nicht: der LXC baut selbst
          # (docker-compose.yml dort sagt `image: mia-os:local`) und holt
          # nichts aus der Registry. Der Bau bleibt trotzdem stehen, denn er
          # beweist, dass das Dockerfile durchlaeuft, und genau das ist der
          # Zweck dieses Workflows.
          #
          # Will Mia GHCR wieder haben, muss das Paket auf GitHub mit dem
          # neuen Repo verknuepft werden. Das ist eine Aenderung an einem
          # oeffentlichen Artefakt und gehoert ihr, nicht einer Nachtschicht.
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate:
    name: Compose pruefen
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config validieren
        run: |
          # Platzhalter-Env, damit die Interpolation nicht meckert
          cp .env.example .env
          docker compose config --quiet
          echo "compose-Datei ist gueltig"
