[project]
name = "mia-os-mcp"
version = "0.1.0"
description = "MCP-Server fuer Mia OS: Eintraege, Aufgaben, Termine und Suche als Werkzeuge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
mia-os-mcp = "mia_os_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mia_os_mcp"]
