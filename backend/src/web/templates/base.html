<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ owner }}{% endblock %}</title>
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Schlanker Rahmen fuer die serverseitigen Restseiten (Editor, 404).
       Dieselben Werte wie in frontend/src/farben.css, das aus farben.json
       entsteht. Hier von Hand, weil diese Seiten ohne Bauschritt
       ausgeliefert werden: aendert sich die Palette, muss diese Liste
       nachgezogen werden. Der Kontrast-Gate in farben_bauen.py deckt sie
       nicht ab. */
    @font-face {
      font-family: "MiaSans";
      src: url("/static/fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --grund: #100b0a; --flaeche: #1c1414; --erhoben: #281d1d; --linie: #3d2f2f;
      --text: #f6f0f0; --gedaempft: #a29594; --akzent: #f33e52; --akzent-text: #fff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --grund: #fdf9f9; --flaeche: #fff; --erhoben: #f7f0ef; --linie: #e6dbdb;
        --text: #1b1414; --gedaempft: #695959; --akzent: #c70030;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--grund); color: var(--text);
      font-family: "MiaSans", system-ui, -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
