<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mia OS" />
    <link rel="manifest" href="/static/gebaut/manifest.webmanifest" />
    <link rel="icon" href="/static/gebaut/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/gebaut/apple-touch-icon.png" />
    <title>Mia OS</title>
    <script>
      // Vor dem ersten Zeichnen, sonst blitzt kurz die andere Farbe auf.
      // Der Server liefert die Einstellung erst nach dem Laden.
      try {
        var t = localStorage.getItem("thema");
        if (t && t !== "standard") document.documentElement.dataset.thema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
